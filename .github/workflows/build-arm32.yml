name: Build arm32 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      
      - name: Install Android platform, build tools, CMake and NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Drop Windows-only JDK path from gradle.properties
        working-directory: MiracastReceiver
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Build armeabi-v7a release APK
        working-directory: MiracastReceiver
        run: chmod +x gradlew && ./gradlew assembleRelease -PbuildArm32 --no-daemon --console=plain

      - name: Sign APK with the fork release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          APK=$(ls MiracastReceiver/app/build/outputs/apk/release/*armeabi-v7a*release*.apk | head -n 1)
          echo "unsigned APK: $APK"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" /tmp/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass "pass:$SIGNING_STORE_PASSWORD" \
            --out MiracastReceiver/app/build/outputs/apk/release/miracast-receiver-1.2.7-armeabi-v7a.apk \
            /tmp/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose MiracastReceiver/app/build/outputs/apk/release/miracast-receiver-1.2.7-armeabi-v7a.apk
          rm -f /tmp/release.keystore /tmp/aligned.apk
          cd MiracastReceiver/app/build/outputs/apk/release
          sha256sum miracast-receiver-1.2.7-armeabi-v7a.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miracast-receiver-1.2.7-armeabi-v7a
          path: |
            MiracastReceiver/app/build/outputs/apk/release/miracast-receiver-1.2.7-armeabi-v7a.apk
            MiracastReceiver/app/build/outputs/apk/release/SHA256SUMS.txt
          retention-days: 30
